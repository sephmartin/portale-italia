<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sportello dimostrativo</title><style>body{font:15px Arial;color:#162c43;margin:24px}h1{font:28px Georgia}button{padding:12px;background:#125ab1;color:white;border:0;border-radius:5px}li{padding:10px}pre{white-space:pre-wrap}small{color:#536c83}</style><h1>Sportello digitale</h1><p>Disponibilità e ricevute dimostrative.</p><button id="load">Mostra disponibilità</button><ul id="slots"></ul><p id="status" role="status"></p><small><a href="__DEMO_BASE__" target="_blank" rel="noopener noreferrer">Apri la demo per confermare</a>. La prenotazione richiede conferma nella demo. Nessun servizio PA collegato.</small><script>
let id=0;const pending=new Map();const status=document.getElementById('status');
function rpc(method,params){return new Promise((resolve,reject)=>{const key=++id;const timer=setTimeout(()=>{pending.delete(key);reject(Error('Collegamento con l’host non disponibile.'));},10000);pending.set(key,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id:key,method,params},'*');});}
function render(r){const data=r?.structuredContent;if(!data)return;const list=document.getElementById('slots');list.replaceChildren();for(const s of data.slots||[]){const li=document.createElement('li');li.textContent=s.label+' · '+(s.available?'Disponibile':'Occupato');list.append(li);}for(const b of data.bookings||[]){const li=document.createElement('li');li.textContent=b.id+' · '+b.label+' · '+b.status;list.append(li);}status.textContent=data.demo?'Dati dimostrativi.':'';}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.jsonrpc!=='2.0')return;const m=e.data,p=pending.get(m.id);if(p){clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result);}if(m.method==='ui/notifications/tool-result')render(m.params);});
const ready=rpc('ui/initialize',{appInfo:{name:'portale-italia',version:'0.2.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*'));ready.catch(e=>status.textContent=e.message);
document.getElementById('load').onclick=async()=>{try{await ready;render(await rpc('tools/call',{name:'demo_availability',arguments:{}}));}catch(e){status.textContent=e.message;}};
</script></html>
